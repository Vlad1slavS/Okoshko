<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="YouMaster — онлайн-запись к мастерам и студиям.">
  <meta name="theme-color" content="#FF426F">
  <title>Окошко</title>
</head>
<style>
  html,
  body {
      width: 100%;
      height: 100%;
      margin: 0;
  }

  #loading-indicator {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;
  }

  .loader-image {
    width: 140px;

    animation: breathe 2.4s ease-in-out infinite;
}

@keyframes breathe {
    0% {
        transform: scale(0.96);
        opacity: .95;
    }

    50% {
        transform: scale(1);
        opacity: 1;
    }

    100% {
        transform: scale(0.96);
        opacity: .95;
    }
}
</style>
<body>
<div id="loading-indicator" class="loading-container">
    <img src="assets/images/auth/logo.png" alt="Loading..." class="loader-image">
</div>

  <script>
    window.removeFlutterLoader = function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() { loader.remove(); }, 400);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
