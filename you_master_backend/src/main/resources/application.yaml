spring:
  application:
    name: okoshko-backend
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  auth:
    otp-pepper: ${AUTH_OTP_PEPPER:local-development-otp-pepper-change-me}
    jwt-secret: ${AUTH_JWT_SECRET:local-development-jwt-secret-change-me-32-bytes}
    otp-ttl: 5m
    resend-delay: 60s
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    expose-dev-code: false
    cookie-secure: false
    cookie-same-site: Lax
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"
