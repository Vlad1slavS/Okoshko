spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/okoshko}
    username: ${DB_USERNAME:okoshko}
    password: ${DB_PASSWORD:okoshko_local_password}
  flyway:
    locations: classpath:db/migration,classpath:db/local
  jpa:
    show-sql: false

logging:
  level:
    io.github.vlad1slavs.okoshko: DEBUG
    org.hibernate.SQL: DEBUG
